<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173a65"><title>司法書士 PASS | 学習デモ</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#182c45;background:#f3f6fb}*{box-sizing:border-box}body{margin:0}header{background:#173a65;color:white;padding:20px 16px}header h1{margin:0;font-size:22px}header small{opacity:.8}main{max-width:760px;margin:auto;padding:18px 14px 90px}.card{background:white;border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 2px 12px #19324c12}h2{font-size:20px;margin:0 0 12px}h3{font-size:16px}p{line-height:1.8}.muted{color:#607187;font-size:13px}.tabs{display:flex;gap:7px;margin-bottom:16px}.tabs button{flex:1;padding:11px 3px;border:0;border-radius:10px;background:#e3eaf4;color:#173a65;font-weight:700}.tabs button.active{background:#173a65;color:white}.subjects{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.subject{border:1px solid #dbe3ef;border-radius:9px;padding:10px;font-size:14px}button{cursor:pointer;font:inherit}.action{border:0;background:#1b64ad;color:white;border-radius:10px;padding:12px 18px;font-weight:700}.option{display:block;width:100%;text-align:left;background:white;border:1px solid #c7d3e2;border-radius:10px;padding:13px;margin:8px 0}.option:disabled{opacity:1;color:#182c45}.correct{border:2px solid #22835c;background:#eaf8f0}.wrong{border:2px solid #b34848;background:#fff0f0}.notice{background:#edf4ff;padding:12px;border-radius:10px;margin-top:12px}.bar{height:10px;background:#e3eaf4;border-radius:10px;overflow:hidden}.fill{height:100%;background:#2374b6;width:0}footer{text-align:center;color:#607187;font-size:12px;padding:12px}a{color:#1b64ad}</style></head><body><header><h1>⚖ 司法書士 PASS</h1><small>2027年合格を目指す学習サービス｜試作品 v0.1</small></header><main><nav class="tabs" aria-label="メニュー"><button class="active" data-tab="home">ホーム</button><button data-tab="lesson">教材</button><button data-tab="quiz">問題演習</button><button data-tab="review">復習</button></nav><div id="view"></div></main><footer>試作版：オリジナル確認問題のみ。過去問10年分は未収録。学習記録はこの端末内だけに保存されます。</footer><script>
'use strict';
const subjects=['民法','不動産登記法','会社法・商法','商業登記法','民事訴訟法','民事執行法','民事保全法','供託法','司法書士法','憲法','刑法'];
const questions=[{id:'m1',q:'錯誤による意思表示は、民法95条の要件を満たす場合、取り消すことができる。',choices:['正しい','誤り'],correct:0,ex:'民法95条1項。要件を満たす錯誤による意思表示は取り消すことができます。'},{id:'m2',q:'強迫による意思表示は、民法96条により取り消すことができる。',choices:['正しい','誤り'],correct:0,ex:'民法96条1項。強迫による意思表示は取り消すことができます。'},{id:'m3',q:'代理人が権限内で本人のためにした意思表示の効果は、原則として代理人自身に帰属する。',choices:['正しい','誤り'],correct:1,ex:'民法99条1項。本人のためにすることを示した権限内の代理行為の効果は本人に帰属します。'}];
const KEY='shihoshoshi-pass-demo-v1';let history=[];try{const value=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(value))history=value}catch(e){}let tab='home',current=0,answer=null,reviewOnly=false;const view=document.getElementById('view');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem(KEY,JSON.stringify(history))}catch(e){}}function latest(id){return [...history].reverse().find(x=>x.id===id)}function wrongIds(){return questions.filter(q=>latest(q.id)&&!latest(q.id).ok).map(q=>q.id)}function stats(){const total=history.length,ok=history.filter(x=>x.ok).length;return {total,ok,pct:total?Math.round(ok/total*100):0}}function render(){document.querySelectorAll('[data-tab]').forEach(b=>{b.classList.toggle('active',b.dataset.tab===tab);b.setAttribute('aria-current',b.dataset.tab===tab?'page':'false')});if(tab==='home'){const s=stats();view.innerHTML=`<section class="card"><h2>今日の学習</h2><p>まずは民法の基礎を学び、問題に挑戦しましょう。</p><p><b>回答回数：</b>${s.total}回　<b>正答率：</b>${s.pct}%</p><div class="bar"><div class="fill" style="width:${s.pct}%"></div></div><p class="muted">進捗はサンプル問題の回答履歴から算出</p><button class="action" id="start">問題を解く</button></section><section class="card"><h2>学習科目（全11科目）</h2><div class="subjects">${subjects.map(s=>`<div class="subject">${esc(s)}</div>`).join('')}</div><p class="muted">現在教材があるのは民法のサンプル章のみです。</p></section>`;document.getElementById('start').onclick=()=>openQuiz(false)}else if(tab==='lesson'){view.innerHTML=`<article class="card"><p class="muted">第1巻 民法 ／ 第1章</p><h2>意思表示と錯誤</h2><h3>1. 錯誤とは？</h3><p>契約などの意思表示をする際、本人の認識に誤りがあることです。</p><h3>2. 民法95条のポイント</h3><p>一定の要件を満たす錯誤による意思表示は、取り消すことができます。重要性や表意者の重大な過失なども検討します。</p><div class="notice">覚えること：現行法では、錯誤の効果は要件を満たす場合の「取消し」です。常に当然無効になるわけではありません。</div><p class="muted">この教材は試作用の要約です。販売用教材には条文・判例・監修・改正確認が必要です。</p><button class="action" id="start">確認問題に進む</button></article>`;document.getElementById('start').onclick=()=>openQuiz(false)}else if(tab==='review'){const ids=wrongIds();view.innerHTML=`<section class="card"><h2>苦手問題の復習</h2><p>直近の回答で間違えた問題：<b>${ids.length}問</b></p>${ids.length?`<p>${ids.map(id=>esc(questions.find(q=>q.id===id).q)).join('</p><p>')}</p><button class="action" id="start">復習を開始</button>`:'<p class="muted">まだ復習対象はありません。問題を解くと表示されます。</p>'}</section>`;const b=document.getElementById('start');if(b)b.onclick=()=>openQuiz(true)}else showQuestion()}
function openQuiz(review){reviewOnly=review;current=0;answer=null;tab='quiz';render()}function pool(){return reviewOnly?questions.filter(q=>wrongIds().includes(q.id)):questions}function showQuestion(){const qs=pool();if(!qs.length){view.innerHTML='<section class="card"><h2>復習完了</h2><p>現在、間違えたままの問題はありません。</p><button class="action" id="restart">全問題に挑戦</button></section>';document.getElementById('restart').onclick=()=>openQuiz(false);return}if(current>=qs.length){view.innerHTML=`<section class="card"><h2>演習完了！</h2><p>${qs.length}問の演習を終えました。</p><button class="action" id="restart">もう一度解く</button></section>`;document.getElementById('restart').onclick=()=>openQuiz(false);return}const q=qs[current];view.innerHTML=`<section class="card"><p class="muted">${reviewOnly?'復習':'民法・確認問題'} ／ ${current+1} / ${qs.length}</p><h2>第${current+1}問</h2><p>${esc(q.q)}</p>${q.choices.map((c,i)=>`<button class="option ${answer!==null?(i===q.correct?'correct':i===answer?'wrong':''):''}" data-answer="${i}" ${answer!==null?'disabled':''}>${i+1}. ${esc(c)}</button>`).join('')}${answer!==null?`<div class="notice"><b>${answer===q.correct?'正解！':'不正解'}</b><p>${esc(q.ex)}</p></div><p><button class="action" id="next">次へ進む →</button></p>`:''}</section>`;document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{if(answer!==null)return;answer=Number(b.dataset.answer);history.push({id:q.id,ok:answer===q.correct,at:new Date().toISOString()});save();showQuestion()});const next=document.getElementById('next');if(next)next.onclick=()=>{current++;answer=null;showQuestion()}}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;answer=null;render()});render();
</script></body></html>
