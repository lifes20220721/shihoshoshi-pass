<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#153a66"><title>司法書士PASS | 民法学習 v0.3</title><style>:root{font-family:system-ui,-apple-system,'Noto Sans JP',sans-serif;color:#172b45;background:#f3f6fb}*{box-sizing:border-box}body{margin:0}header{background:#153a66;color:#fff;padding:18px 16px}header h1{margin:0;font-size:23px}header p{margin:5px 0 0;color:#d5e6f9;font-size:13px}main{max-width:760px;margin:auto;padding:15px}.panel{background:#fff;border-radius:14px;padding:18px;margin:0 0 14px;box-shadow:0 2px 9px #172b4510}h2{font-size:19px;margin:0 0 13px}h3{font-size:16px;margin:15px 0 7px}p{line-height:1.8}button,select{font:inherit}button{border:1px solid #bdc9d7;background:white;color:#153a66;border-radius:10px;padding:12px 15px;cursor:pointer;min-height:44px}button.primary{background:#1764a3;color:white;border-color:#1764a3}button:disabled{opacity:.8;cursor:default}button.option{width:100%;display:block;text-align:left;margin:9px 0}button.correct{background:#e5f6ec;border-color:#16854e}button.wrong{background:#fff0ef;border-color:#c74739}.actions{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.muted{color:#607186;font-size:13px}.hidden{display:none!important}.lesson{border-top:1px solid #e6eaf0;padding-top:12px;margin-top:12px}.tag{display:inline-block;background:#eaf1f9;color:#23578a;border-radius:20px;padding:4px 10px;font-size:12px}.feedback{border-radius:10px;background:#f2f6fa;padding:10px 14px;margin:12px 0}.feedback:empty{display:none}progress{width:100%;height:14px}footer{text-align:center;color:#66778a;font-size:12px;padding:18px}select{width:100%;padding:12px;border:1px solid #bdc9d7;border-radius:10px;background:#fff}.warning{border-left:4px solid #c18a25;background:#fff8e8;padding:10px;font-size:13px}ul{line-height:1.9;padding-left:23px}</style></head><body><header><h1>⚖ 司法書士PASS</h1><p>2027年度合格を目指す学習サイト｜Ver.0.3</p></header><main><section id="home" class="panel"><h2>学習ホーム</h2><p class="muted">民法・総則を4つの分野に分けて学びます。</p><div id="stats"></div><div class="actions"><button class="primary" onclick="show('lessons')">📖 テキストを読む</button><button onclick="startQuiz(false)">✏️ 問題を解く</button><button onclick="startQuiz(true)">🔁 間違いを復習</button></div><p class="warning">本版の問題は独自作成の○×問題20問です。公式過去問は未収録です。法律の学習補助用で、専門家による監修前の試作教材です。</p></section><section id="lessons" class="panel hidden"><h2>民法総則 テキスト</h2><div id="lessonList"></div><div class="actions"><button onclick="show('home')">← ホームへ</button></div></section><section id="quiz" class="panel hidden"><h2 id="quizTitle">確認問題</h2><label for="topic">出題範囲</label><select id="topic" onchange="startQuiz(false)"><option value="all">全分野</option></select><p id="counter" class="muted"></p><h3 id="question"></h3><div id="options"></div><div id="feedback" class="feedback" aria-live="polite"></div><div class="actions"><button id="next" class="primary hidden" onclick="nextQuestion()">次の問題 →</button><button onclick="show('home')">ホームへ</button></div></section><section class="panel"><h2>学習記録</h2><p class="muted">学習履歴はこのブラウザ内に保存されます。ブラウザのデータ削除・端末変更で消えることがあります。</p><button onclick="resetData()">学習履歴を初期化</button></section></main><footer>司法書士PASS 試作版 v0.3｜教材は2026年10月時点の条文を前提に作成した未監修の独自教材です。</footer><script>
const chapters=[{id:'capacity',title:'第1章 権利能力と意思能力',body:['自然人は出生によって権利能力を取得します（民法3条1項）。','意思能力を有しない状態でした法律行為は無効です（民法3条の2）。取消しとは区別します。','胎児は相続・不法行為による損害賠償など一定の場面で、すでに生まれたものとみなされます（民法721条、886条など）。']},{id:'minor',title:'第2章 未成年者の法律行為',body:['成年年齢は18歳です（民法4条）。','未成年者が法律行為をするには原則として法定代理人の同意が必要です（民法5条1項）。','単に権利を得る行為、義務を免れる行為、許された財産の処分などには例外があります（民法5条）。','同意を要する行為を同意なしでした場合は、原則として取り消すことができます（民法5条2項）。']},{id:'guardianship',title:'第3章 成年後見制度',body:['精神上の障害により事理を弁識する能力を欠く常況にある者について、家庭裁判所は後見開始の審判をすることができます（民法7条）。','成年被後見人の法律行為は原則として取り消すことができます。ただし、日用品の購入その他日常生活に関する行為は除きます（民法9条）。','保佐開始は事理弁識能力が著しく不十分な場合、補助開始は不十分な場合が基本的な要件です（民法11条、15条）。']},{id:'declaration',title:'第4章 意思表示',body:['心裡留保による意思表示は原則有効ですが、相手方が真意でないことを知り、又は知ることができたときは無効です（民法93条）。','相手方と通じてした虚偽の意思表示は無効です（民法94条1項）。','錯誤による意思表示は民法95条所定の要件を満たす場合、取り消すことができます。','詐欺又は強迫による意思表示は取り消すことができます（民法96条1項）。']}];
const questions=[
{id:'m01',t:'capacity',q:'自然人は出生によって権利能力を取得する。',a:0,why:'○ 民法3条1項。出生により権利能力を取得します。'},
{id:'m02',t:'capacity',q:'意思能力を有しない状態でした法律行為は、取り消すことができるにとどまる。',a:1,why:'× 民法3条の2。意思能力を欠く状態でした法律行為は無効です。'},
{id:'m03',t:'capacity',q:'胎児は相続について、既に生まれたものとみなされる。',a:0,why:'○ 民法886条1項。ただし死体で生まれたときは適用されません（同条2項）。'},
{id:'m04',t:'capacity',q:'胎児は不法行為による損害賠償請求権について、既に生まれたものとみなされる。',a:0,why:'○ 民法721条。胎児についての特則です。'},
{id:'m05',t:'capacity',q:'自然人は20歳になるまで権利能力を持たない。',a:1,why:'× 権利能力は出生により取得します（民法3条1項）。成年年齢とは別です。'},
{id:'m06',t:'minor',q:'民法上の成年年齢は18歳である。',a:0,why:'○ 民法4条。'},
{id:'m07',t:'minor',q:'未成年者が法定代理人の同意なく行った法律行為は、例外なく取り消せる。',a:1,why:'× 民法5条。単に権利を得る行為等は例外です。'},
{id:'m08',t:'minor',q:'未成年者が単に義務を免れる法律行為には、法定代理人の同意は不要である。',a:0,why:'○ 民法5条1項ただし書。'},
{id:'m09',t:'minor',q:'未成年者は法定代理人が目的を定めて処分を許した財産を、その目的の範囲内で自由に処分できる。',a:0,why:'○ 民法5条3項。'},
{id:'m10',t:'minor',q:'未成年者が同意を要する法律行為を同意なしでした場合、その行為は常に当然無効となる。',a:1,why:'× 原則として取り消すことができます（民法5条2項）。当然無効とは異なります。'},
{id:'m11',t:'guardianship',q:'成年被後見人の法律行為は、原則として取り消すことができる。',a:0,why:'○ 民法9条本文。'},
{id:'m12',t:'guardianship',q:'成年被後見人が行う日用品の購入は、民法9条による取消しの対象となる。',a:1,why:'× 日用品の購入その他日常生活に関する行為は取消しの対象から除かれます（民法9条ただし書）。'},
{id:'m13',t:'guardianship',q:'後見開始の審判は家庭裁判所が行う。',a:0,why:'○ 民法7条。'},
{id:'m14',t:'guardianship',q:'保佐開始の要件は、精神上の障害により事理を弁識する能力が著しく不十分であることである。',a:0,why:'○ 民法11条。'},
{id:'m15',t:'guardianship',q:'補助開始の審判では、本人以外の者が請求した場合でも本人の同意は不要である。',a:1,why:'× 本人以外の者の請求による補助開始の審判には本人の同意が必要です（民法15条2項）。'},
{id:'m16',t:'declaration',q:'心裡留保による意思表示は、相手方の認識にかかわらず常に無効である。',a:1,why:'× 原則有効です。ただし相手方が真意でないことを知り、又は知ることができたときは無効です（民法93条）。'},
{id:'m17',t:'declaration',q:'相手方と通じてした虚偽の意思表示は無効である。',a:0,why:'○ 民法94条1項。'},
{id:'m18',t:'declaration',q:'錯誤による意思表示は、民法95条の要件を満たす場合に取り消すことができる。',a:0,why:'○ 民法95条。重要性などの要件を検討します。'},
{id:'m19',t:'declaration',q:'強迫による意思表示は取り消すことができる。',a:0,why:'○ 民法96条1項。'},
{id:'m20',t:'declaration',q:'詐欺による意思表示は、民法上、常に当然無効である。',a:1,why:'× 詐欺による意思表示は取り消すことができます（民法96条1項）。'}];
const KEY='shihoshoshi-pass-v03';let data;try{data=JSON.parse(localStorage.getItem(KEY))||null}catch(e){}if(!data){let prev;try{prev=JSON.parse(localStorage.getItem('shihoshoshi-pass-v02'))}catch(e){}data={answers:Array.isArray(prev?.answers)?prev.answers:[],wrong:Array.isArray(prev?.wrong)?prev.wrong:[]};}let queue=[],pos=0,review=false,answered=false;
function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}}function show(id){for(const x of ['home','lessons','quiz'])document.getElementById(x).classList.toggle('hidden',x!==id);renderStats();window.scrollTo(0,0)}function renderStats(){let n=data.answers.length,c=data.answers.filter(x=>x.correct).length;document.getElementById('stats').innerHTML=`<p>累計解答：<b>${n}</b>問 ／ 正答率：<b>${n?Math.round(c/n*100):0}%</b> ／ 復習対象：<b>${data.wrong.length}</b>問</p><progress max="100" value="${n?100*c/n:0}"></progress>`}function startQuiz(onlyWrong){review=onlyWrong;let t=document.getElementById('topic').value;queue=questions.filter(x=>(t==='all'||x.t===t)&&(!onlyWrong||data.wrong.includes(x.id)));pos=0;show('quiz');document.getElementById('quizTitle').textContent=onlyWrong?'間違い復習':'民法・確認問題';renderQuestion()}function renderQuestion(){let q=queue[pos],op=document.getElementById('options');answered=false;document.getElementById('next').classList.add('hidden');document.getElementById('feedback').textContent='';if(!q){document.getElementById('counter').textContent='';document.getElementById('question').textContent=review?'この範囲に復習する問題はありません。':'演習が終了しました。';op.innerHTML='';return}document.getElementById('counter').textContent=`${pos+1} / ${queue.length}問`;document.getElementById('question').textContent=q.q;op.innerHTML='';['○ 正しい','× 誤り'].forEach((label,i)=>{let b=document.createElement('button');b.className='option';b.textContent=label;b.onclick=()=>answer(i);op.appendChild(b)})}function answer(i){if(answered)return;answered=true;let q=queue[pos],ok=i===q.a;data.answers.push({id:q.id,correct:ok,time:new Date().toISOString()});if(ok)data.wrong=data.wrong.filter(id=>id!==q.id);else if(!data.wrong.includes(q.id))data.wrong.push(q.id);save();Array.from(document.getElementById('options').children).forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('correct');else if(j===i)b.classList.add('wrong')});let fb=document.getElementById('feedback');fb.textContent=(ok?'正解！ ':'不正解。 ')+q.why;document.getElementById('next').textContent=pos===queue.length-1?'終了する':'次の問題 →';document.getElementById('next').classList.remove('hidden')}function nextQuestion(){pos++;if(pos>=queue.length)show('home');else renderQuestion()}function resetData(){if(confirm('この端末の学習履歴を削除しますか？')){data={answers:[],wrong:[]};save();show('home')}}const list=document.getElementById('lessonList'),select=document.getElementById('topic');chapters.forEach(ch=>{let s=document.createElement('section');s.className='lesson';let h=document.createElement('h3');h.textContent=ch.title;s.appendChild(h);ch.body.forEach(t=>{let p=document.createElement('p');p.textContent=t;s.appendChild(p)});let b=document.createElement('button');b.textContent='この分野の問題を解く →';b.onclick=()=>{select.value=ch.id;startQuiz(false)};s.appendChild(b);list.appendChild(s);let opt=document.createElement('option');opt.value=ch.id;opt.textContent=ch.title;select.appendChild(opt)});renderStats();
</script></body></html>
