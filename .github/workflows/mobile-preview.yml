name: Build mobile preview
on:
  pull_request:
    paths: ['mobile/**', '.github/workflows/mobile-preview.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [shihoshoshi, gyoseishoshi]
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: node scripts/fetch-sources.mjs
      - name: Configure public old-server reviewer settings for preview
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const config=JSON.parse(fs.readFileSync('review-access.public.json','utf8'));
          const review=config.shihoshoshi.reviewAccess;
          if(review.endpoint!=='https://xs968799.xsrv.jp/pass-review'||review.issuer!==review.endpoint||review.publicKey?.d)throw Error('Unexpected reviewer preview configuration');
          fs.writeFileSync('store-config.local.json',JSON.stringify(config),{mode:0o600});
          NODE
      - run: npm test
      - name: Test PHP installer and reviewer service locally
        run: node --test tests/xserver-installer.integration.mjs
      - run: npm run build
      - name: Test built reviewer flow without calling the live server
        run: node tests/reviewer-ui.cjs
      - name: Verify preview embeds only the old reviewer endpoint
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const js=fs.readFileSync('dist/shihoshoshi/app.js','utf8');
          if(!js.includes('https://xs968799.xsrv.jp/pass-review')||js.includes('xs366651'))throw Error('Unexpected built reviewer endpoint');
          NODE
      - run: npm run native -- ${{ matrix.app }} android
      - name: Build debug preview APK
        run: bash native/${{ matrix.app }}/android/gradlew -p native/${{ matrix.app }}/android assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-debug-preview
          path: mobile/native/${{ matrix.app }}/android/app/build/outputs/apk/debug/app-debug.apk
