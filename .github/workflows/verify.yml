name: Verify learning app
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm test
      - name: Check committed cache revisions
        run: |
          npm run prepare:release
          git diff --exit-code -- index.html service-worker.js
      - name: Build XServer static package without deploying
        run: npm run package:xserver
      - uses: actions/upload-artifact@v4
        with:
          name: shihoshoshi-xserver-static
          path: release/xserver/
          if-no-files-found: error
