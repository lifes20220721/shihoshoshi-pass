name: Verify learning app
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm test
      - name: Check committed cache revisions
        run: |
          npm run prepare:release
          git diff --exit-code -- index.html service-worker.js
