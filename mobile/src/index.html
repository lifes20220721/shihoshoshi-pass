<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#173f5f">
  <title>PASS 学習アプリ</title>
  <link rel="stylesheet" href="app.css">
  <script defer src="app.js"></script>
</head>
<body>
  <header><div><small>資格の学習を、毎日の習慣に</small><h1 id="appName">PASS</h1></div><button id="homeButton" aria-label="ホームへ">ホーム</button></header>
  <main id="main" tabindex="-1"></main>
  <section id="studyArea" hidden><div class="study-toolbar"><button id="closeStudy">← アプリホーム</button><span>全機能を学習中</span></div><div id="studyFrame"></div></section>
  <div id="toast" role="status" aria-live="polite"></div>
  <input type="file" id="backupFile" accept="application/json,.json" hidden>
</body>
</html>
